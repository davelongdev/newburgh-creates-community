# the site's base url
baseURL = 'https://newburghcreatescommunity.com'

# the site's locale (replaces the deprecated languageCode)
locale = 'en-us'

# the site's title
title = 'newburgh creates community'

# custom parameters
[params] 

# the site's main description
    description = 'a place for people in the newburgh creates community - resources, projects, & information'

# menu items
[menu]

  [[menu.main]]
    identifier = "about"
    name = "about"
    url = "/about"
    weight = 10

  [[menu.main]]
    identifier = "projects"
    name = "projects"
    url = "/projects"
    weight = 38

  [[menu.main]]
    identifier = "first teams"
    name = "first teams"
    url = "/first-teams"
    weight = 30

  [[menu.main]]
    identifier = "buildlab"
    name = "buildlab"
    url = "/buildlab"
    weight = 35

  [[menu.main]]
    identifier = "blog"
    name = "blog"
    url = "/blog"
    weight = 40

  [[menu.main]]
    identifier = "contact"
    name = "contact"
    url = "/contact"
    weight = 50

# allow markup to include html elements
[markup.goldmark.renderer]
  unsafe = true

# syntax highlighting theme for fenced code blocks
[markup.highlight]
  style = "catppuccin-mocha"

[security]
  allowContent = ['.*']

# disable browser caching for the local dev server only (no effect on the built site)
[[server.headers]]
  for = "/**"
  [server.headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
